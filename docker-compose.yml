services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: kollektiv
      POSTGRES_PASSWORD: kollektiv
      POSTGRES_DB: kollektiv
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kollektiv -d kollektiv"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
